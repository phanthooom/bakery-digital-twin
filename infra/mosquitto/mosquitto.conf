# Mosquitto 2 — конфигурация для разработки.
# ВНИМАНИЕ: анонимный доступ. Для продакшна включите password_file / TLS (см. docs/mqtt-contract.md).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
