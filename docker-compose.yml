name: bakery-digital-twin

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: bakery-mosquitto
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:1883:1883"   # MQTT (ESP32, симулятор, API)
      - "${BIND_IP:-127.0.0.1}:9001:9001"   # MQTT over WebSocket (для отладки из браузера)
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  influxdb:
    image: influxdb:2.7
    container_name: bakery-influxdb
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-bakery-admin-pass}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-bakery}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-bakery}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-bakery-dev-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: bakery-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-true}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DEFAULT_LOCALE: ru-RU
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
      INFLUX_TOKEN: ${INFLUX_TOKEN:-bakery-dev-token}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mosquitto-data:
  influxdb-data:
  influxdb-config:
  grafana-data:
